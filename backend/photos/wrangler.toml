name = "rehaan-student-photos"
main = "worker.mjs"
compatibility_date = "2026-10-17"

[vars]
CLOUDINARY_CLOUD_NAME = "salatmdv"
CLOUDINARY_UPLOAD_PRESET = "ml_default"
FIREBASE_PROJECT_ID = "rehaan-computers"
ALLOWED_ORIGINS = "https://rehaan-computers.web.app,https://rehaan-computers.firebaseapp.com,http://localhost:8000,http://127.0.0.1:8000"

[[ratelimits]]
name = "PHOTO_UPLOAD_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# Configure CLOUDINARY_API_KEY and CLOUDINARY_API_SECRET using wrangler secret put.
# Add localhost/preview origins explicitly only when needed. Never use '*'.
