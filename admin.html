<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Rehaan Computers Admin Dashboard">
<meta name="theme-color" content="#060606">
<meta name="robots" content="noindex, nofollow">
<title>Rehaan Computers — Admin Dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23060606'/%3E%3Crect x='2' y='2' width='60' height='60' rx='12' fill='none' stroke='%23d6ad55' stroke-width='2'/%3E%3Ctext x='32' y='42' font-family='Georgia,serif' font-size='26' font-weight='bold' fill='%23f2d38a' text-anchor='middle'%3ERC%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<link rel="stylesheet" href="style.css">
<style>
/* Fee Management premium black/gold — scoped to this admin module. */
.rc-fees{background:#111215;color:#f5f2ec;border:1px solid #474035;border-radius:19px;padding:22px;margin:18px 0;font-family:inherit;box-shadow:0 15px 45px #00000018}
.rc-fees-top{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;flex-wrap:wrap}
.rc-fees-top h2{color:#f7f1df;margin:4px 0 8px;font-size:clamp(22px,3vw,30px)}
.rc-fees-top p{color:#bcb8af;font-size:13px;margin:0}
.rc-fees .rc-eyebrow{color:#d5aa5d;font-weight:750;letter-spacing:1.8px;font-size:10px}
.rc-fees-tag{border:1px solid #8a683a;border-radius:100px;padding:7px 11px;color:#e8c780;font-size:11px}
.rc-fees-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:23px 0}
.rc-fees-kpis>div{background:#1e2023;border:1px solid #373634;border-radius:13px;padding:16px;display:flex;flex-direction:column;gap:11px}
.rc-fees-kpis small,.rc-fee-row small{color:#bcb8af;font-size:11px}
.rc-fees-kpis strong{color:#f6e5c1;font-size:clamp(19px,2vw,25px);overflow-wrap:anywhere}
.rc-fees-heading{display:flex;justify-content:space-between;gap:12px;align-items:center;color:#f8edda;margin:13px 0}
.rc-fees-heading span{font-size:11px;color:#a8a49e}
.rc-fees-rows{border:1px solid #383736;border-radius:14px;overflow:hidden}
.rc-fee-row{display:grid;grid-template-columns:minmax(140px,2fr) minmax(115px,1fr) minmax(125px,1.25fr);gap:10px;align-items:center;padding:16px;border-bottom:1px solid #383736;background:#1b1c1f}
.rc-fee-row:last-child{border-bottom:0}
.rc-fee-identity,.rc-fee-amount{display:flex;flex-direction:column;gap:6px}
.rc-fee-identity b{color:#f8f4ec;font-size:14px}
.rc-fee-amount b{color:#efd294;font-size:15px}
.rc-fee-actions{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.rc-fee-actions button{cursor:pointer;border:1px solid #61533d;background:#29251f;border-radius:9px;padding:9px 11px;color:#f4dbad;font-size:12px;font-weight:650}
.rc-fee-actions button.rc-reminder{background:#17392d;color:#b6f3cb;border-color:#438267}
.rc-fees-empty,.rc-fees-footnote{padding:16px;color:#bcb8af;font-size:12px}
@media(max-width:740px){.rc-fees{padding:12px}.rc-fees-kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.rc-fee-row{grid-template-columns:1fr 1fr}.rc-fee-actions{grid-column:1/-1;justify-content:flex-start}.rc-fees-heading{align-items:flex-start;flex-direction:column}}

/* Compact premium tuition action on Enrolled Students cards */
.admin-page .rc-monthly-action{background:linear-gradient(135deg,#29231a,#171719);border:1px solid #a27b43;border-radius:10px;color:#f4d7a2;font-weight:700;padding:10px 14px;box-shadow:0 3px 12px #00000019;transition:background .2s,border-color .2s}
.admin-page .rc-monthly-action:hover{background:#3a2d1b;border-color:#dbb570}
.admin-page .rc-reminder-action{background:#17392d;border:1px solid #438267;border-radius:10px;color:#b6f3cb;padding:10px 14px;font-weight:700}
</style>
<style>
/* Premium monthly fee payment panel */
.admin-page .rc-payment-modal{background:linear-gradient(145deg,#1c1d21,#101114);border:1px solid #735b35;color:#f6eedc;max-width:560px;border-radius:20px;box-shadow:0 24px 80px #0009}
.admin-page .rc-payment-modal h3{color:#f6e4bf;font-size:25px;margin:8px 0}
.admin-page .rc-pay-eyebrow{color:#d9ae65;letter-spacing:1.7px;font-weight:750;font-size:11px}
.admin-page .rc-pay-subtitle,.admin-page .rc-pay-help{color:#bcb8b0;font-size:13px;line-height:1.55}
.admin-page .rc-pay-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:22px 0}
.admin-page .rc-pay-stats>div{background:#252528;border:1px solid #4a4338;border-radius:12px;padding:14px 10px;display:flex;flex-direction:column;gap:10px}
.admin-page .rc-pay-stats span{font-size:11px;color:#bbb2a3}
.admin-page .rc-pay-stats strong{font-size:19px;color:#f1d69e;overflow-wrap:anywhere}
.admin-page .rc-pay-stats .rc-pay-due{color:#f0bc7d}
.admin-page .rc-payment-form{display:flex;flex-direction:column;gap:13px}
.admin-page .rc-payment-form label{display:flex;flex-direction:column;gap:7px;color:#eee0c7;font-weight:650;font-size:13px}
.admin-page .rc-payment-form input{background:#111215;color:#f8f1e6;border:1px solid #927042;border-radius:9px;padding:13px;font-size:17px;width:100%;box-sizing:border-box}
.admin-page .rc-pay-preview{color:#c8c0b0;margin:0}.admin-page .rc-pay-preview strong{color:#b8edc8}
.admin-page .rc-payment-form .admin-save-btn{background:linear-gradient(110deg,#d6ae69,#b68b4a);color:#18130c;border:0;border-radius:10px;font-weight:750;padding:13px;cursor:pointer}
.admin-page .rc-payment-form .admin-save-btn:disabled{opacity:.5;cursor:not-allowed}
@media(max-width:580px){.admin-page .rc-pay-stats{grid-template-columns:1fr}.admin-page .rc-pay-stats>div{flex-direction:row;justify-content:space-between;align-items:center}}
</style>
</head>

<body class="admin-page">

<div class="admin-wrapper">

<!-- LOGIN -->
<section id="adminLoginCard" class="admin-login-card">

<div class="admin-brand">
<div class="admin-brand-logo">RC</div>
<h1>Rehaan Computers</h1>
<p>Secure Admin Dashboard</p>
</div>

<form id="adminLoginForm">

<div class="admin-form-group">
<label for="adminEmail">Admin Email</label>
<input type="email" id="adminEmail" name="adminEmail" placeholder="Enter admin email" autocomplete="username" required>
</div>

<div class="admin-form-group">
<label for="adminPassword">Password</label>
<input type="password" id="adminPassword" name="adminPassword" placeholder="Enter admin password" autocomplete="current-password" required>
</div>

<button type="submit" id="adminLoginButton" class="admin-login-button">Login to Dashboard</button>

<div id="adminLoginMessage" style="display:none;"></div>

</form>

<p class="admin-login-note">For administrators only. Not a student? <a href="index.html#admission">Apply for admission here</a> — open all year, no last date.</p>

</section>

<!-- DASHBOARD -->
<section id="adminDashboard">

<header class="admin-dashboard-header">

<div>
<h1>Admin Dashboard</h1>
<p>Rehaan Computers — Admission Applications</p>
</div>

<div class="admin-actions">
<a href="index.html" class="admin-back-button">← Back to Website</a>
<button type="button" id="refreshApplications" class="admin-action-button">↻ Refresh</button>
<button type="button" id="adminLogoutBtn" class="admin-action-button admin-logout-button">Logout</button>
</div>

</header>

<div class="applications-title">
<h2>Admission Applications</h2>
</div>

<div id="applicationsList" class="applications-list">
<div class="admin-loading">Loading applications...</div>
</div>

</section>

</div>

<script type="module" src="script.js"></script>
<script type="module">
/* REHAAN COMPUTERS - admin fixes. Load in admin.html AFTER script.js */

import { getApps } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
    getAuth,
    signOut,
    setPersistence,
    inMemoryPersistence
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


/* 1. Always ask for email + password when the admin page opens */

// keep the dashboard hidden until any old saved login is cleared
const hideDashboard = document.createElement("style");
hideDashboard.textContent = "#adminDashboard{display:none!important}";
document.head.appendChild(hideDashboard);

// if the browser restores the page from the Back button, reload it fresh
window.addEventListener("pageshow", event => {
    if (event.persisted) {
        window.location.reload();
    }
});

const auth = getAuth(getApps()[0]);

auth.authStateReady()
    .then(() => signOut(auth))
    .then(() => setPersistence(auth, inMemoryPersistence))
    .catch(error => console.error("Admin session reset error:", error))
    .then(() => setTimeout(() => hideDashboard.remove(), 400));


/* 2. Replace "APPLICATION NaN" with the student's name */

const list = document.getElementById("applicationsList");

if (list) {

    const fixLabels = () => {

        list.querySelectorAll(".application-number").forEach(label => {

            if (label.textContent.includes("NaN")) {

                const heading = label
                    .closest(".application-card")
                    ?.querySelector("h3");

                label.textContent = heading
                    ? heading.textContent.trim()
                    : "";
            }

        });

    };

    new MutationObserver(fixLabels).observe(list, {
        childList: true,
        subtree: true
    });

    fixLabels();

}

</script>

</body>
</html>
